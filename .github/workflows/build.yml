# Builds the APK on every push and pull request, and checks the promises the README makes,
# so a broken change shows up before release. The APK here is signed with a throwaway key.
# Releases are signed with the maintainer's key (release.sh).
name: build
on: [push, pull_request]
permissions: { contents: read }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Design tokens and contrast
        run: |
          python3 tools/check_tokens.py
          python3 tools/check_contrast.py
      - name: No logging, no network code, Instagram only
        run: |
          if grep -rn "android.util.Log\|java.net\|HttpURLConnection\|javax.net" src; then exit 1; fi
          # Instagram only: exactly one packageNames attribute, and it is exactly Instagram.
          [ "$(grep -c 'packageNames' res/xml/accessibility.xml)" = 1 ]
          grep -q 'android:packageNames="com.instagram.android"' res/xml/accessibility.xml
      - name: Android 16 SDK (Play needs targetSdk 36)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null
      - name: Schedule
        run: |
          JAR="$ANDROID_HOME/platforms/android-36/android.jar"
          javac -nowarn -cp "$JAR" -d out/test src/dev/local/reelblock/State.java src/dev/local/reelblock/ReelBlockService.java tools/ScheduleTest.java
          java -cp "out/test:$JAR" dev.local.reelblock.ScheduleTest
      - run: NO_INSTALL=1 ./build.sh
      - name: One permission (Play billing), target SDK, size
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging ReelBlock.apk | grep -E "^package|permission|sdkVersion"
          [ "$("$BT/aapt2" dump badging ReelBlock.apk | grep uses-permission)" = "uses-permission: name='com.android.vending.BILLING'" ] \
            || { echo "Reel Block may ask only for com.android.vending.BILLING"; exit 1; }
          "$BT/aapt2" dump badging ReelBlock.apk | grep -q "targetSdkVersion:'36'"
          echo "APK size: $(stat -c %s ReelBlock.apk) bytes, AAB size: $(stat -c %s ReelBlock.aab) bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: ReelBlock-unsigned-test
          path: |
            ReelBlock.apk
            ReelBlock.aab
