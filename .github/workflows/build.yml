# Builds the APK on every push and pull request, and checks the promises the README makes,
# so a broken change shows up before release. The APK here is signed with a throwaway key.
# Releases are signed with the maintainer's key (release.sh).
name: build
on: [push, pull_request]
permissions: { contents: read }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Design tokens and contrast
        run: |
          python3 tools/check_tokens.py
          python3 tools/check_contrast.py
      - name: No logging, no network code, Instagram only
        run: |
          if grep -rn "android.util.Log\|java.net\|HttpURLConnection\|javax.net" src; then exit 1; fi
          # Instagram only: exactly one packageNames attribute, and it is exactly Instagram.
          [ "$(grep -c 'packageNames' res/xml/accessibility.xml)" = 1 ]
          grep -q 'android:packageNames="com.instagram.android"' res/xml/accessibility.xml
      - run: NO_INSTALL=1 ./build.sh
      - name: No permissions, size
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging ReelBlock.apk | grep -E "^package|permission|sdkVersion"
          if "$BT/aapt2" dump badging ReelBlock.apk | grep -q uses-permission; then echo "Reel Block must ask for no permission"; exit 1; fi
          echo "APK size: $(stat -c %s ReelBlock.apk) bytes"
      - uses: actions/upload-artifact@v4
        with: { name: ReelBlock-unsigned-test, path: ReelBlock.apk }
